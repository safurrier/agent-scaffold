name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Quality Gate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Override Python version
        run: mise use python@${{ matrix.python-version }}

      - name: Setup
        run: mise run setup

      - name: Check
        run: mise run ci

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: test-results/
          if-no-files-found: ignore

  smoke-test:
    name: Init Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Setup scaffold
        run: mise run setup

      - name: Init non-interactive (Python single)
        run: mise run init -- --non-interactive --name smoketest --shape single --stack python --no-hooks

      - name: Trust generated mise config
        run: mise trust .mise.toml

      - name: Setup generated project
        run: mise run setup

      - name: Check generated project
        run: mise run check

  verify:
    name: Full Validation
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Setup
        run: mise run setup

      - name: Verify
        run: mise run verify
