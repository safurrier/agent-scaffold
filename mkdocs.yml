site_name: harness-toolkit
site_description: Harness Engineering Toolkit for agent-ready repositories
site_url: https://safurrier.github.io/harness-toolkit
repo_url: https://github.com/safurrier/harness-toolkit
repo_name: safurrier/harness-toolkit

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Task Contract: task-contract.md
  - Repo Shapes: shapes.md
  - Portable Workflow: portable-workflow.md
  - Harness Kit Design: harness-kit-lifecycle-design.md
  - Scripts Contract Prototype: script-contract-prototype.md
  - Release and Installation: release.md
  - Stacks:
      - Overview: stacks/index.md
      - Acceptance Rubric: stacks/acceptance-rubric.md
      - Python: stacks/python.md
      - Go: stacks/go.md
      - Rust: stacks/rust.md
  - Init System: init-system.md
  - CI & Hooks: ci.md
  - Development: development.md
  - Decisions:
      - ADR 0001 — Spec-Driven Decision Loop: decisions/0001-spec-driven-decision-loop.md
      - ADR 0002 — Plan Workflow: decisions/0002-plan-workflow.md
      - ADR 0003 — Deterministic Slice Contract: decisions/0003-deterministic-slice-contract.md
      - ADR 0004 — Skill-First Slice Workflow: decisions/0004-skill-first-slice-workflow.md
      - ADR 0005 — Harden Sync Contract CI: decisions/0005-harden-sync-contract-ci.md
      - ADR 0006 — Plan Contract Modules and Stack Rubric: decisions/0006-followup-contract-stack-rubric.md
      - ADR 0007 — Harness Engineering Toolkit Naming: decisions/0007-harness-toolkit-naming.md
      - ADR 0008 — Harness Kit Ledger-First Local Assistant: decisions/0008-harness-kit-ledger-first-local-assistant.md
      - ADR 0009 — Harness Kit Lifecycle-First CLI: decisions/0009-harness-kit-lifecycle-first-cli.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
