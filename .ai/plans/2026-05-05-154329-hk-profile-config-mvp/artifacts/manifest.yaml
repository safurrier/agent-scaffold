    description: Raw HK command log from profile/config dogfood.
  - path: artifacts/dogfood-dread-worker-report.md
    type: report
    description: Dread worker report from profile/config dogfood.
  - path: artifacts/dogfood-foreman-worker-report.md
    type: report
    description: Foreman worker report from profile/config dogfood.
  - path: artifacts/dogfood-dread-handoff.md
    type: report
    description: Dread generated HK handoff after parent sync remediation.
  - path: artifacts/dogfood-foreman-handoff.md
    type: report
    description: Foreman generated HK handoff after parent sync remediation.
