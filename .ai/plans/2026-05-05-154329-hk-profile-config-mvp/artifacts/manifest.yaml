    type: report
    description: User decisions for HK profile/config MVP scope and schema.
  - path: artifacts/profile-config-dogfood-study.md
    type: dogfood-rerun
    description: Dogfood results for user-level config with inline profiles/checks/reviews in dread and foreman temp clones.
