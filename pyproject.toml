[project]
name = "agent-scaffold"
version = "0.1.0"
description = "Opinionated starter for agent-driven engineering"
requires-python = ">=3.12"
dependencies = [
    "click>=8.0",
    "jinja2>=3.0",
]

[project.scripts]
agent-scaffold = "agent_scaffold.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.6",
    "mkdocs-material>=9.5",
    "ruff>=0.9",
    "ty>=0.0.19",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_scaffold"]

# ── Ruff ─────────────────────────────────────
[tool.ruff]
extend-exclude = ["stacks/", "templates/", ".agent/skills/"]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501", "S101"]

# ── Pytest ───────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 600
addopts = "-n auto --dist=loadfile"
markers = [
    "contract: structural checks on the scaffold itself (fast)",
    "unit: pure function tests with no I/O (fast)",
    "e2e: full init+setup+check workflows against temp projects",
    "slow: tests that take a long time (deselect with '-m not slow')",
    "go: tests requiring the Go toolchain",
    "rust: tests requiring the Rust toolchain",
]

# ── ty ───────────────────────────────────────
[tool.ty.environment]
extra-paths = ["src", ".", "templates/.agent/skills/slice-workflow/cli/src"]

[tool.ty.src]
exclude = ["stacks/**", "templates/**", ".agent/skills/**"]
